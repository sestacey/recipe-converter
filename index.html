<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeConverter & Generator</title>
    <!-- Combined Styling Engine -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://unpkg.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdf8f5; color: #1e293b; }
        .brand-bg { background-color: #e05a47; }
        .brand-text { color: #e05a47; }
        .brand-light { background-color: #fbeee6; }
    </style>
</head>
<body class="min-h-screen antialiased pb-12">
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="brand-bg text-white p-2 rounded-xl shadow-md">
                    <i data-lucide="chef-hat" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">Recipe<span class="brand-text">Converter</span></h1>
                    <p class="text-xs text-gray-500">Create, scale, and tailor recipes instantly</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Side: Input Panel -->
            <section class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-4">
                    <h2 class="font-semibold text-gray-900 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 brand-text"></i> Magic Recipe Generator
                    </h2>
                    <div class="flex gap-2">
                        <input id="promptInput" type="text" placeholder="e.g., Fudgy Brownies, Garlic Chicken..." class="flex-1 p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-opacity-20 focus:border-red-400">
                        <button onclick="generateFromAI()" class="px-4 brand-bg hover:opacity-90 text-white font-medium rounded-xl text-sm shadow-md transition-all">Generate</button>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-4">
                        <h2 class="font-semibold text-gray-900 flex items-center gap-2 mb-2">
                            <i data-lucide="file-text" class="w-4 h-4 brand-text"></i> Or Paste Recipe
                        </h2>
                        <textarea id="recipeInput" rows="6" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none text-sm placeholder-gray-400" placeholder="Paste ingredients and instructions here..."></textarea>
                    </div>

                    <button onclick="processRecipe()" class="w-full py-3 bg-gray-800 hover:bg-gray-900 text-white font-medium rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                        <i data-lucide="wand-2" class="w-4 h-4"></i> Parse & Convert
                    </button>
                </div>
            </section>

            <!-- Right Side: View Panel -->
            <section class="lg:col-span-7 space-y-6">
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-1">Servings</label>
                        <div class="flex items-center border border-gray-200 rounded-xl bg-gray-50 p-1">
                            <button onclick="adjustMultiplier(-0.5)" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-sm font-bold">-</button>
                            <span id="multiplierValue" class="flex-1 text-center font-bold text-sm">1x</span>
                            <button onclick="adjustMultiplier(0.5)" class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-sm font-bold">+</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-1">Units</label>
                        <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl text-xs font-medium">
                            <button id="unitUS" onclick="setUnitSystem('US')" class="py-2 px-2 rounded-lg text-center bg-white shadow-sm font-semibold">US</button>
                            <button id="unitMetric" onclick="setUnitSystem('Metric')" class="py-2 px-2 rounded-lg text-center text-gray-600">Metric</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-1">Diet Style</label>
                        <select id="dietToggle" onchange="applyDietaryFilter()" class="w-full p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium focus:outline-none">
                            <option value="original">✨ Original</option>
                            <option value="vegan">🌱 Vegan</option>
                            <option value="keto">🥩 Keto</option>
                            <option value="glutenfree">🌾 Gluten-Free</option>
                            <option value="paleo">🍖 Paleo</option>
                            <option value="fodmap">🥣 Low-FODMAP</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden p-6 space-y-6">
                    <div id="outputEmptyState" class="text-center py-12 space-y-2">
                        <div class="w-12 h-12 mx-auto brand-light rounded-full flex items-center justify-center">
                            <i data-lucide="cooking-pot" class="w-6 h-6 brand-text"></i>
                        </div>
                        <h3 class="font-semibold text-gray-700">Ready to Cook</h3>
                        <p class="text-gray-400 text-xs max-w-xs mx-auto">Generate or paste a recipe on the left to activate smart conversions.</p>
                    </div>

                    <div id="outputContent" class="hidden space-y-6">
                        <div>
                            <h3 class="font-bold text-gray-900 text-lg flex items-center gap-2 mb-3">
                                <i data-lucide="shopping-basket" class="w-5 h-5 brand-text"></i> Ingredients List
                            </h3>
                            <ul id="ingredientsList" class="space-y-2"></ul>
                        </div>
                        <div class="border-t border-gray-100 pt-4">
                            <h3 class="font-bold text-gray-900 text-lg flex items-center gap-2 mb-3">
                                <i data-lucide="list-ordered" class="w-5 h-5 brand-text"></i> Instructions
                            </h3>
                            <div id="instructionsContainer" class="text-sm text-gray-600 space-y-2 leading-relaxed bg-gray-50 p-4 rounded-xl border border-gray-100 whitespace-pre-line"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        let currentMultiplier = 1.0;
        let currentSystem = 'US';
        let currentDiet = 'original';
        let parsedRecipe = { baseIngredients: [], baseInstructions: "" };

        const conversions = {
            'cup': 240, 'cups': 240, 'tbsp': 15, 'tsp': 5, 'oz': 28, 'ounce': 28, 'ounces': 28
        };

        const substitutions = {
            vegan: { 'milk': 'almond milk', 'egg': 'flax egg binder', 'butter': 'plant-based butter', 'honey': 'maple syrup' },
            keto: { 'flour': 'almond flour', 'sugar': 'erythritol', 'milk': 'heavy whipping cream' },
            glutenfree: { 'flour': '1:1 gluten-free flour blend' },
            paleo: { 'flour': 'coconut flour', 'sugar': 'raw honey', 'milk': 'coconut milk', 'butter': 'ghee' },
            fodmap: { 'garlic': 'chive-infused oil', 'onion': 'green onion tops (green parts only)' }
        };

        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

        function generateFromAI() {
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt) return alert("Please enter a dish name!");
            
            const mockRecipe = `Homemade Custom ${prompt}\n\n1.5 cups flour\n2 tsp baking powder\n0.5 cup sugar\n1 cup milk\n1 large egg\n1 tsp garlic\n\nInstructions:\n1. Combine all dry components in a large mixing bowl.\n2. Gently fold in the wet elements until smooth.\n3. Bake or cook over medium heat until golden brown and ready to serve.`;
            
            document.getElementById('recipeInput').value = mockRecipe;
            processRecipe();
        }

        function processRecipe() {
            const text = document.getElementById('recipeInput').value.trim();
            if(!text) return;
            
            const lines = text.split('\n');
            parsedRecipe.baseIngredients = [];
            let inst = [];
            let isInst = false;

            lines.forEach(l => {
                let t = l.trim();
                if(!t) return;
                if(t.toLowerCase().includes('instruction')) { isInst = true; return; }
                
                if(!isInst) {
