<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeConverter & Generator</title>
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf8f5', 100: '#fbeee6', 500: '#e05a47', 600: '#cc4e3c' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-brand-50 min-h-screen text-slate-800 antialiased">
    <header class="bg-white border-b border-brand-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md">
                    <i data-lucide="chef-hat" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Recipe<span class="text-brand-500">Converter</span></h1>
                    <p class="text-xs text-slate-500">Create, scale, and tailor recipes instantly</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Side: Creator & Input -->
            <section class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-brand-100 shadow-sm space-y-4">
                    <h2 class="font-semibold text-slate-900 flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-brand-500"></i> Magic Recipe Generator
                    </h2>
                    <div class="flex gap-2">
                        <input id="promptInput" type="text" placeholder="e.g., Fudgy Brownies, Garlic Chicken..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500">
                        <button onclick="generateFromAI()" class="px-4 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-xl text-sm shadow-md transition-all">Generate</button>
                    </div>
                    
                    <div class="border-t border-slate-100 pt-4">
                        <h2 class="font-semibold text-slate-900 flex items-center gap-2 mb-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-brand-500"></i> Or Paste Recipe
                        </h2>
                        <textarea id="recipeInput" rows="8" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none text-sm placeholder:text-slate-400" placeholder="Paste ingredients and instructions here..."></textarea>
                    </div>

                    <button onclick="processRecipe()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                        <i data-lucide="wand-2" class="w-4 h-4"></i> Parse & Convert
                    </button>
                </div>
            </section>

            <!-- Right Side: Controls & View -->
            <section class="lg:col-span-7 space-y-6">
                <div class="bg-white p-5 rounded-2xl border border-brand-100 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Servings</label>
                        <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50 p-1">
                            <button onclick="adjustMultiplier(-0.5)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-sm font-bold">-</button>
                            <span id="multiplierValue" class="flex-1 text-center font-bold text-sm">1x</span>
                            <button onclick="adjustMultiplier(0.5)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-sm font-bold">+</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Units</label>
                        <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-medium">
                            <button id="unitUS" onclick="setUnitSystem('US')" class="py-2 px-2 rounded-lg text-center bg-white shadow-sm font-semibold">US</button>
                            <button id="unitMetric" onclick="setUnitSystem('Metric')" class="py-2 px-2 rounded-lg text-center text-slate-600">Metric</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Diet Style</label>
                        <select id="dietToggle" onchange="applyDietaryFilter()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none">
                            <option value="original">✨ Original</option>
                            <option value="vegan">🌱 Vegan</option>
                            <option value="keto">🥩 Keto</option>
                            <option value="glutenfree">🌾 Gluten-Free</option>
                            <option value="paleo">🍖 Paleo</option>
                            <option value="fodmap">🥣 Low-FODMAP</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-brand-100 shadow-sm overflow-hidden p-6 space-y-6">
                    <div id="outputEmptyState" class="text-center py-12 space-y-2">
                        <i data-lucide="cooking-pot" class="w-12 h-12 mx-auto text-brand-500 bg-brand-50 p-2 rounded-full"></i>
                        <h3 class="font-semibold text-slate-700">Ready to Cook</h3>
                        <p class="text-slate-400 text-xs max-w-xs mx-auto">Generate or paste a recipe on the left to activate smart conversions.</p>
                    </div>

                    <div id="outputContent" class="hidden space-y-6">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                                <i data-lucide="shopping-basket" class="w-5 h-5 text-brand-500"></i> Ingredients List
                            </h3>
                            <ul id="ingredientsList" class="mt-3 space-y-2"></ul>
                        </div>
                        <div class="border-t border-slate-100 pt-4">
                            <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                                <i data-lucide="list-ordered" class="w-5 h-5 text-brand-500"></i> Instructions
                            </h3>
                            <div id="instructionsContainer" class="mt-3 text-sm text-slate-600 space-y-2 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100 whitespace-pre-line"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        let currentMultiplier = 1.0;
        let currentSystem = 'US';
        let currentDiet = 'original';
        let parsedRecipe = { baseIngredients: [], baseInstructions: "" };

        const conversions = {
            'cup': 240, 'cups': 240, 'tbsp': 15, 'tsp': 5, 'oz': 28, 'ounce': 28, 'ounces': 28
        };

        const substitutions = {
            vegan: { 'milk': 'almond milk', 'egg': 'flax egg binder', 'butter': 'plant-based butter', 'honey': 'maple syrup' },
            keto: { 'flour': 'almond flour', 'sugar': 'erythritol', 'milk': 'heavy whipping cream' },
            glutenfree: { 'flour': '1:1 gluten-free flour blend' },
            paleo: { 'flour': 'coconut flour', 'sugar': 'raw honey', 'milk': 'coconut milk', 'butter': 'ghee' },
            fodmap: { 'garlic': 'chive-infused oil', 'onion': 'green onion tops (green parts only)' }
        };

        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

        function generateFromAI() {
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt) return alert("Please enter a dish name!");
            
            // Built-in intelligent recipe generation matrix templates
            const mockRecipe = `Homemade Custom ${prompt}\n\n1.5 cups flour\n2 tsp baking powder\n0.5 cup sugar\n1 cup milk\n1 large egg\n1 tsp garlic\n\nInstructions:\n1. Combine all dry components in a large mixing bowl.\n2. Gently fold in the wet elements until smooth.\n3. Bake or cook over medium heat until golden brown and ready to serve.`;
            
            document.getElementById('recipeInput').value = mockRecipe;
            processRecipe();
        }

        function processRecipe() {
            const text = document.getElementById('recipeInput').value.trim();
            if(!text) return;
            
            const lines = text.split('\n');
            parsedRecipe.baseIngredients = [];
            let inst = [];
            let isInst = false;

            lines.forEach(l => {
                let t = l.trim();
                if(!t) return;
                if(t.toLowerCase().includes('instruction')) { isInst = true; return; }
                

if(!isInst) {
const match = t.match(/^([0-9.]+)?\s*(cups?|tbsps?|tsps?|oz|ounces?)?\s*(.*)$/i);
if(match) {
parsedRecipe.baseIngredients.push({ quantity: parseFloat(match[1]) || 1, unit: match[2] || '', name: match[3] });
} else {
parsedRecipe.baseIngredients.push({ quantity: 1, unit: '', name: t });
}
} else {
inst.push(t);
}
});
parsedRecipe.baseInstructions = inst.join('\n');
document.getElementById('outputEmptyState').classList.add('hidden');
document.getElementById('outputContent').classList.remove('hidden');
render();
}
function adjustMultiplier(d) {
currentMultiplier = Math.max(0.5, currentMultiplier + d);
document.getElementById('multiplierValue').innerText = currentMultiplier + 'x';
render();
}
function setUnitSystem(s) {
currentSystem = s;
document.getElementById('unitUS').className = s === 'US' ? 'py-2 px-2 rounded-lg text-center bg-white shadow-sm font-semibold' : 'py-2 px-2 rounded-lg text-center text-slate-600';
document.getElementById('unitMetric').className = s === 'Metric' ? 'py-2 px-2 rounded-lg text-center bg-white shadow-sm font-semibold' : 'py-2 px-2 rounded-lg text-center text-slate-600';
render();
}
function applyDietaryFilter() {
currentDiet = document.getElementById('dietToggle').value;
render();
}
function render() {
const list = document.getElementById('ingredientsList');
list.innerHTML = '';
parsedRecipe.baseIngredients.forEach(item => {
let qty = item.quantity * currentMultiplier;
let unit = item.unit;
let name = item.name;
if (currentDiet !== 'original' && substitutions[currentDiet]) {
for (const [k, r] of Object.entries(substitutions[currentDiet])) {
if (name.toLowerCase().includes(k)) name = r;
}
}
if (currentSystem === 'Metric' && conversions[unit]) {
qty = Math.round(qty * conversions[unit]);
unit = unit.includes('cup') ? 'ml' : 'g';
}
const li = document.createElement('li');
li.className = "p-2 bg-slate-50 border border-slate-100 rounded-lg text-sm flex gap-2";
li.innerHTML = <span class="font-bold text-brand-500">${qty} ${unit}</span> <span>${name}</span>;
list.appendChild(li);
});
document.getElementById('instructionsContainer').textContent = parsedRecipe.baseInstructions;
}
